apply plugin: 'com.android.application'

// Load build extras (generated by build-android.sh from .apk.conf)
if (file('../build-extras.gradle').exists()) {
    apply from: '../build-extras.gradle'
}

android {
    namespace ext.hasProperty('apkApplicationId') ? ext.apkApplicationId : 'app.library.twa'
    compileSdk ext.hasProperty('apkCompileSdk') ? ext.apkCompileSdk : 34

    defaultConfig {
        applicationId ext.hasProperty('apkApplicationId') ? ext.apkApplicationId : 'app.library.twa'
        minSdk ext.hasProperty('apkMinSdk') ? ext.apkMinSdk : 19
        targetSdk ext.hasProperty('apkTargetSdk') ? ext.apkTargetSdk : 34
        versionCode ext.hasProperty('apkVersionCode') ? ext.apkVersionCode : 1
        versionName ext.hasProperty('apkVersionName') ? ext.apkVersionName : '1.0'
    }

    signingConfigs {
        release {
            storeFile ext.hasProperty('apkKeystorePath')
                    ? file(ext.apkKeystorePath)
                    : file('../certres/android.keystore')
            storePassword ext.hasProperty('apkKeystorePassword')
                    ? ext.apkKeystorePassword : 'android'
            keyAlias ext.hasProperty('apkKeyAlias')
                    ? ext.apkKeyAlias : 'library-app'
            keyPassword ext.hasProperty('apkKeyPassword')
                    ? ext.apkKeyPassword : 'android'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
