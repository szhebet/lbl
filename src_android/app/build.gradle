apply plugin: 'com.android.application'

// Load build extras (generated by build-android.sh from .apk.conf)
if (file('../build-extras.gradle').exists()) {
    apply from: '../build-extras.gradle'
}

// Capture project-scoped extra properties at script top level where `ext`
// unambiguously refers to the project's ExtraPropertiesExtension. Inside the
// `android {}` block `ext` resolves against the AppExtension delegate, whose
// own extra-properties extension shadows project.ext.
def apkVersionCode = ext.has('apkVersionCode') ? ext.get('apkVersionCode') : 1
def apkVersionName = ext.has('apkVersionName') ? ext.get('apkVersionName') : '1.0'
def apkApplicationId = ext.has('apkApplicationId') ? ext.get('apkApplicationId') : 'app.library.twa'
def apkCompileSdk = ext.has('apkCompileSdk') ? ext.get('apkCompileSdk') : 34
def apkMinSdk = ext.has('apkMinSdk') ? ext.get('apkMinSdk') : 19
def apkTargetSdk = ext.has('apkTargetSdk') ? ext.get('apkTargetSdk') : 34
def apkKeystorePath = ext.has('apkKeystorePath') ? ext.get('apkKeystorePath') : file('../certres/android.keystore')
def apkKeystorePassword = ext.has('apkKeystorePassword') ? ext.get('apkKeystorePassword') : 'android'
def apkKeyAlias = ext.has('apkKeyAlias') ? ext.get('apkKeyAlias') : 'library-app'
def apkKeyPassword = ext.has('apkKeyPassword') ? ext.get('apkKeyPassword') : 'android'

android {
    namespace apkApplicationId
    compileSdk apkCompileSdk

    defaultConfig {
        applicationId apkApplicationId
        minSdk apkMinSdk
        targetSdk apkTargetSdk
        versionCode apkVersionCode
        versionName apkVersionName
    }

    signingConfigs {
        release {
            storeFile apkKeystorePath
            storePassword apkKeystorePassword
            keyAlias apkKeyAlias
            keyPassword apkKeyPassword
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
