<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Администрирование — Домашняя библиотека</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
    <div class="container">
        <a href="/admin" class="back-link" id="adminBackLink" data-back="/admin">&larr; Назад к управлению</a>
        <h1 style="margin-bottom:20px">Администрирование</h1>

        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="users" data-short="П">Пользователи</button>
            <button class="admin-tab" data-tab="neighbours" data-short="С">Серверы</button>
        </div>

        <div id="tab-users" class="admin-content active">
            <div class="admin-toolbar">
                <button id="addUserBtn" class="btn">+ Создать пользователя</button>
                <input type="text" class="filter-input" id="filter-users" placeholder="Фильтр: имя, email, роль...">
            </div>
            <div class="pagination" id="usersPaginationTop"></div>
            <table class="admin-table" id="table-users">
                <thead><tr>
                    <th data-sort="id">ID<span class="sort-arrow"></span></th>
                    <th data-sort="username">Имя пользователя<span class="sort-arrow"></span></th>
                    <th data-sort="email">Email<span class="sort-arrow"></span></th>
                    <th data-sort="role">Роль<span class="sort-arrow"></span></th>
                    <th data-sort="parent_names">Родитель<span class="sort-arrow"></span></th>
                    <th data-sort="created_at">Создан<span class="sort-arrow"></span></th>
                    <th class="actions">Действия</th>
                </tr></thead>
                <tbody id="usersTableBody"></tbody>
            </table>
            <div class="pagination" id="usersPagination"></div>
        </div>

        <div id="tab-neighbours" class="admin-content">
            <div class="admin-toolbar">
                <button id="addNeighbourBtn" class="btn">+ Добавить сервер</button>
                <input type="text" class="filter-input" id="filter-neighbours" placeholder="Фильтр: URL, пользователь...">
                <button id="testAllNeighboursBtn" class="btn btn-secondary">Тест</button>
            </div>
            <div class="pagination" id="neighboursPaginationTop"></div>
            <table class="admin-table" id="table-neighbours">
                <thead><tr>
                    <th data-sort="id">ID<span class="sort-arrow"></span></th>
                    <th data-sort="url">URL<span class="sort-arrow"></span></th>
                    <th data-sort="username">Пользователь<span class="sort-arrow"></span></th>
                    <th data-sort="has_password">Пароль<span class="sort-arrow"></span></th>
                    <th data-sort="has_certs">Сертификаты<span class="sort-arrow"></span></th>
                    <th data-sort="disabled">Отключен<span class="sort-arrow"></span></th>
                    <th class="actions">Действия</th>
                </tr></thead>
                <tbody id="neighboursTableBody"></tbody>
            </table>
            <div class="pagination" id="neighboursPagination"></div>
        </div>
    </div>

    <div id="adminModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="adminModalTitle">Редактирование</h2>
                <button class="modal-close" onclick="closeAdminModal()">&times;</button>
            </div>
            <form id="adminForm">
                <div id="adminModalBody" class="modal-body"></div>
                <div class="modal-footer">
                    <button type="submit" class="btn">Сохранить</button>
                    <button type="button" class="btn btn-secondary" onclick="closeAdminModal()">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Редактирование</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="editForm">
                <div id="modalBody" class="modal-body"></div>
                <div class="modal-footer">
                    <button type="submit" class="btn">Сохранить</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js?v=2"></script>
    <script src="/static/js/auth.js?v=2"></script>
    <script src="/static/js/import.js"></script>
    <script src="/static/js/admin.js?v=2"></script>
    <script>
    if (typeof AndroidTokenBridge !== 'undefined') {
        document.querySelectorAll('link[rel="stylesheet"]').forEach(function(link) {
            link.addEventListener('error', function() {
                try { AndroidTokenBridge.notifyCriticalResourceFailed('css'); } catch(e) {}
            });
        });
        window.addEventListener('error', function(e) {
            if (e.filename && e.filename.indexOf('/static/js/') !== -1) {
                try { AndroidTokenBridge.notifyCriticalResourceFailed('js'); } catch(e2) {}
            }
        }, true);
    }
    </script>
</body>
</html>
