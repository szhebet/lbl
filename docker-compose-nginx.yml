services:
  nginx:
    image: nginx:alpine
    container_name: library-nginx
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certres/server.crt:/etc/nginx/certs/server.crt:ro
      - ./certres/server.key:/etc/nginx/certs/server.key:ro
    depends_on:
      - app
    restart: unless-stopped
 app:
    ports:[]

