<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 64">
  <defs>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#333"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#666"/>
      <stop offset="100%" stop-color="#444"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#d9d9d9"/>
    </linearGradient>
    <linearGradient id="bookmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#999"/>
      <stop offset="100%" stop-color="#777"/>
    </linearGradient>
    <linearGradient id="penBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
    <linearGradient id="penTip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#222"/>
    </linearGradient>
  </defs>

  <!-- Book -->

  <!-- Left cover -->
  <path d="M4 14 L22 17 L22 51 L4 46 Z" fill="url(#cover)"/>
  <!-- Right cover -->
  <path d="M42 14 L24 17 L24 51 L42 46 Z" fill="url(#cover)"/>

  <!-- Spine -->
  <rect x="22" y="15.5" width="3" height="36" rx="1" fill="url(#spine)"/>

  <!-- Left pages -->
  <path d="M5.5 15.5 L21.5 18.5 L21.5 49.5 L5.5 45 Z" fill="url(#page)" opacity="0.9"/>
  <!-- Right pages -->
  <path d="M40.5 15.5 L24.5 18.5 L24.5 49.5 L40.5 45 Z" fill="url(#page)" opacity="0.9"/>

  <!-- Page lines left -->
  <line x1="8" y1="23" x2="18" y2="24.5" stroke="#c0c0c0" stroke-width="0.4"/>
  <line x1="8" y1="28" x2="18" y2="29.5" stroke="#c0c0c0" stroke-width="0.4"/>
  <line x1="8" y1="33" x2="18" y2="34.5" stroke="#c0c0c0" stroke-width="0.4"/>
  <line x1="8" y1="38" x2="18" y2="39.5" stroke="#c0c0c0" stroke-width="0.4"/>

  <!-- Page lines right -->
  <line x1="27.5" y1="24.5" x2="37.5" y2="23" stroke="#c0c0c0" stroke-width="0.4"/>
  <line x1="27.5" y1="29.5" x2="37.5" y2="28" stroke="#c0c0c0" stroke-width="0.4"/>
  <line x1="27.5" y1="34.5" x2="37.5" y2="33" stroke="#c0c0c0" stroke-width="0.4"/>

  <!-- Bookmark -->
  <path d="M23 17 L23 42 L21.5 39.5 L20 42 L20 17 Z" fill="url(#bookmark)"/>

  <!-- Pen / Quill (vertical, parallel to book) -->

  <!-- Pen shaft -->
  <polygon points="54,18 59,18 57,54 55,54" fill="url(#penBody)" stroke="#777" stroke-width="0.3"/>

  <!-- Pen nib / tip -->
  <polygon points="54,18 59,18 56.5,8" fill="url(#penTip)" stroke="#222" stroke-width="0.3"/>

  <!-- Ink slit on nib -->
  <line x1="56.5" y1="8" x2="56.5" y2="15" stroke="#333" stroke-width="0.5"/>

  <!-- Pen band / ferrule -->
  <rect x="54" y="18" width="5" height="2.5" rx="0.5" fill="#999" stroke="#666" stroke-width="0.3"/>
</svg>
